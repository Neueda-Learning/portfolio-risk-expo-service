name: Build and Push Artifacts

on:
  workflow_run:
    workflows: ["CI checks"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set lowercase repository name
        run: echo "GH_REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push [BACKEND] image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.GH_REPO_LC }}/backend:${{ env.IMAGE_TAG }},
                ghcr.io/${{ env.GH_REPO_LC }}/backend:latest
        
      - name: Build and push [FRONTEND] image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.GH_REPO_LC }}/frontend:${{ env.IMAGE_TAG }},
                ghcr.io/${{ env.GH_REPO_LC }}/frontend:latest
