name: GCP Cloud Run Deployment [BACKEND]

on:
  workflow_run:
    workflows: ["Build and Push Artifacts"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The tag from GHCR to deploy'
        required: true
        default: 'latest'
env:
  PROJECT_ID: "project-7ff52764-7883-4474-b19" #Make it repo env var later
  REGION: "europe-west1"
  GHCR_IMAGE: "ghcr.io/${{ github.repository }}"


jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if the CI pipeline was successful (skip if it failed)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write
  steps:
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/${{ env.PROJECT_ID }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
        service_account: 'github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'
    - name: Deploy to Cloud Run [BACKEND]
      uses: google-github-actions/deploy-cloudrun@v3
      with:
        service: 'backend-service'
        image: ${{ env.GHCR_IMAGE }}/backend:${{ github.event.inputs.image_tag }}
    - name: Deploy to Cloud Run [FRONTEND]
      uses: google-github-actions/deploy-cloudrun@v3
      with:
        service: 'frontend-service'
        image: ${{ env.GHCR_IMAGE }}/frontend:${{ github.event.inputs.image_tag }}
  
