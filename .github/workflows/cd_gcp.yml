name: GCP Cloud Run Deployment

on:
  workflow_run:
    workflows: ["Build and Push Artifacts"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The tag from GHCR to deploy'
        required: true
        default: 'latest'
env:
  PROJECT_ID: "project-7ff52764-7883-4474-b19" #Make it repo env var later
  PROJECT_NUMBER: "36155288499"
  REGION: "europe-west1"
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || github.event.workflow_run.head_sha }}


jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if the CI pipeline was successful (skip if it failed)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set lowercase repository name
        run: echo "GH_REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Deploy to Cloud Run [BACKEND]
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: 'cloud-run-spring-boot-backend'
          image: ghcr.io/${{ env.GH_REPO_LC }}/backend:${{ env.IMAGE_TAG }}

      - name: Deploy to Cloud Run [FRONTEND]
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: 'nextjs-frontend'
          image: ghcr.io/${{ env.GH_REPO_LC }}/frontend:${{ env.IMAGE_TAG }}
  
